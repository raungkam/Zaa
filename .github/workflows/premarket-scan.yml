name: Pre-market scan
on:
  schedule:
    - cron: "30 12 * * 1-5"   # 12:30 UTC = 8:30 ET (EDT) / 7:30 ET (EST), before the 9:30 open
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scanner.py
        env:
          BENZINGA_API_KEY: ${{ secrets.BENZINGA_API_KEY }}
      - name: Commit results
        run: |
          git config user.name "premarket-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || (git commit -m "Pre-market scan $(date -u +%F)" && git push)
